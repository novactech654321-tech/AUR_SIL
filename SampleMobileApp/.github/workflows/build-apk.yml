name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK
        run: dotnet publish SampleMobileApp.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -p:AcceptAndroidSDKLicenses=True

      - uses: actions/upload-artifact@v4
        with:
          name: SampleMobileApp-apk
          path: bin/Release/net10.0-android/publish/*-Signed.apk
